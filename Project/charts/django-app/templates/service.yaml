apiVersion: v1
kind: Service
metadata:
  # Назва Service, зазвичай береться з .Chart.Name та .Release.Name
  name: { { include "django-app.fullname" . } }
  labels: { { - include "django-app.labels" . | nindent 4 } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: http
      protocol: TCP
      name: http
  selector: { { - include "django-app.selectorLabels" . | nindent 4 } }
